<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول | Mirage</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;color:#f4f6ff;font-family:Tahoma,Arial,sans-serif;padding:24px}
.card{width:min(100%,420px);padding:38px;border:1px solid #28334d;border-radius:22px;background:#121a2d;box-shadow:0 24px 80px #0006}
.brand{font-size:30px;font-weight:800;letter-spacing:1px}.brand span{color:#7c9cff}.sub{color:#aab5ce;margin:8px 0 30px;font-size:14px}
label{display:block;margin:18px 0 8px;color:#dbe3f6;font-size:14px}input{width:100%;padding:14px;border:1px solid #35415d;border-radius:10px;background:#0c1426;color:white;font-size:16px;outline:none}input:focus{border-color:#829cff}
button{width:100%;border:0;border-radius:10px;padding:14px;margin-top:24px;background:#6f8fff;color:#081126;font-weight:800;font-size:16px;cursor:pointer}
.notice{padding:12px;border-radius:9px;margin:12px 0;background:#3c2632;color:#ffdce5;font-size:13px}.notice.success{background:#18392f;color:#c9ffdf}
small{display:block;color:#7785a3;text-align:center;margin-top:24px}
</style></head><body><main class="card"><div class="brand">MIRAGE<span>.</span></div><p class="sub">منصة إدارة العملاء واكتشاف الشركات<br>سجّل الدخول للمتابعة إلى لوحة التحكم</p>
{% with messages=get_flashed_messages(with_categories=true) %}{% for kind,msg in messages %}<div class="notice {{kind}}">{{msg}}</div>{% endfor %}{% endwith %}
<form method="post" action="/login"><label for="username">اسم المستخدم</label><input id="username" name="username" autocomplete="username" required autofocus value="Admin">
<label for="password">كلمة المرور</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">دخول إلى Mirage ←</button></form><small>دخول آمن للمسؤولين · Mirage Platform</small></main></body></html>
